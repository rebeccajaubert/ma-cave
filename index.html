<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ma Cave</title>
<meta name="theme-color" content="#0f2a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Cave">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>
<canvas id="scene"></canvas>

<div id="topbar">
  <div id="searchbox">
    <span class="loupe">⌕</span>
    <input id="search" type="search" placeholder="Rechercher une bouteille…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button id="searchClear" hidden aria-label="Effacer">✕</button>
  </div>
  <button id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div id="results" hidden></div>

<div id="banner" hidden>
  <div class="bannerRow"><span id="bannerText"></span><button id="bannerDone">Terminé</button></div>
  <div id="bannerQty" class="bannerRow">Bouteilles par emplacement
    <span class="mini"><button data-bstep="-1" aria-label="Une de moins">−</button><b id="bannerQtyVal">1</b><button data-bstep="1" aria-label="Une de plus">+</button></span></div>
</div>
<div id="adjustBar" hidden><span id="adjustText"></span>
  <div class="bannerRow"><button id="adjustCancel">Annuler</button><button id="adjustDone">Terminé</button></div></div>
<div id="hint"></div>
<div id="updateBar" hidden role="status"><span id="updateText"></span><button id="updateBtn">Mettre à jour</button></div>
<div id="undo" hidden role="status"><span id="undoText"></span><button id="undoBtn">Annuler</button></div>
<nav id="nav">
  <button data-view="overview">Vue<br>d'ensemble</button>
  <button data-view="G">Mur<br>gauche</button>
  <button data-view="IG">Îlot<br>gauche</button>
  <button data-view="ID">Îlot<br>droit</button>
  <button data-view="D">Mur<br>droit</button>
</nav>
<div id="toast" hidden></div>

<div id="sheet" hidden>
  <div id="sheetHead"><div id="sheetTitle"></div><button id="sheetClose" aria-label="Fermer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="sheetBody"></div>
</div>

<div id="dialog" hidden><div id="dialogBox"><p id="dialogText"></p>
  <div class="btns"><button class="btn" id="dialogCancel">Annuler</button><button class="btn primary" id="dialogOk">Continuer</button></div></div></div>

<input id="photoInput" type="file" accept="image/*" hidden>
<input id="importInput" type="file" accept="application/json,.json" hidden>
<!-- Le numéro ?v= change à chaque version (il doit être égal à APP_VERSION, un test le vérifie) :
     Safari ne peut ainsi jamais réutiliser une copie périmée d'un fichier après une mise à jour. -->
<script type="importmap">{ "imports": { "./lib.js": "./lib.js?v=1.0.0", "./db.js": "./db.js?v=1.0.0", "./scan.js": "./scan.js?v=1.0.0" } }</script>
<script src="version.js?v=1.0.0"></script>
<script type="module" src="app.js?v=1.0.0"></script>
</body>
</html>
